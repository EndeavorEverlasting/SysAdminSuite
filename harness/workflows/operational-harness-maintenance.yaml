schema_version: sas-operational-harness-workflow/v1
workflow_id: operational-harness-maintenance
mode: local_transform
network_activity: false
target_mutation: false
purpose: >-
  Maintain the repository harness floor so a fresh agent can inspect local repo state, select a workflow,
  resolve desired product/runtime state, validate safely, produce artifacts, advance toward the requested
  terminal outcome, and hand off without changing product behavior or the governance contract.

inputs:
  required:
    - repository_root
    - current_branch
    - owned_scope
    - forbidden_scope
    - requested_goal
  optional:
    - failure_log
    - supplied_pull_request_metadata

stages:
  - id: inspect
    order: 1
    actions:
      - read AGENTS.md without modifying it
      - inspect local git status, current branch, refs, and supplied PR metadata
      - read CODEBASE_MAP.md
      - read harness/api/operational-harness-manifest.json
      - read harness/api/harness-command-registry.json
      - read harness/api/harness-validator-registry.json
      - read harness/api/harness-artifact-registry.json
      - read harness/api/harness-outcome-registry.json
      - read harness/api/deployment-state-registry.json
      - inspect existing validators, hooks, skills, reports, desired-state contracts, and artifact contracts
    stop_conditions:
      - repository cannot be resolved
      - unrelated uncommitted work would be overwritten

  - id: route
    order: 2
    actions:
      - choose the smallest existing skill and workflow that match the task
      - use harness/skills/harness-maintenance/SKILL.md for harness-infrastructure-owned work
      - use harness/skills/outcome-driven-execution/SKILL.md when intermediate tests, fixtures, transport certs, or dry runs could otherwise become artificial endpoints
      - use harness/skills/cybernet-autologon-deployment-state/SKILL.md when AutoLogon/Cybernet desired-state routing is implicated
      - fail closed when equal-priority routes conflict
      - declare lane, mission, owned scope, forbidden scope, artifacts, validation, requested goal, desired state when applicable, and proof ceiling

  - id: implement
    order: 3
    actions:
      - reuse canonical harness components before creating new ones
      - keep writes inside maps, workflows, validators, registries, hooks, skills, reports, schemas, and harness CI
      - preserve product code and AGENTS.md
      - keep generated evidence under ignored survey/output roots
      - encode every canonical command with an outcome contract so a green validator or dry run cannot silently become completion
      - encode deployment-oriented field intent as desired states tied to current product truth and critical artifacts so live-cert or test cannot substitute for application
      - preserve already-proven workstation state rather than teaching agents to reinstall software without need

  - id: validate
    order: 4
    actions:
      - python harness/validators/validate-harness-registries.py
      - python harness/validators/validate-outcome-contracts.py
      - python harness/validators/validate-deployment-state-contracts.py
      - python Tests/survey/test_operational_harness_completeness_contracts.py
      - python scripts/check-repo-text-policy.py --cached
      - python Tests/survey/test_local_harness_contracts.py
      - bash tests/survey/run_offline_survey_tests.sh
      - git diff --check
    escalation:
      - use harness/api/harness-validator-registry.json to add broader Pester, build, or E2E validation only when changed files intersect those contracts
      - after a successful admission validator, continue when requested_goal remains unproven and the outcome/deployment-state registries identify the next safe authorized transition

  - id: failure
    order: 5
    actions:
      - stop at the first failed proof boundary
      - classify the failure as contract, deployment-state/product-truth, dependency, representation, integration, or runtime
      - preserve logs and generated evidence outside Git
      - repair the smallest owning harness component
      - rerun the failed validator before broader suites
    forbidden:
      - bypassing a failed validator
      - deleting unrelated work
      - claiming runtime proof from static checks
      - confusing transport live certification with AutoLogon application
      - ending with tests passed or command printed when the requested goal remains unproven and a safe continuation exists

  - id: commit
    order: 6
    actions:
      - name every changed file
      - commit coherent harness work locally
      - emit the exact operator-approved publish command
      - route remote push and PR actions to operational-harness-publish

  - id: handoff
    order: 7
    actions:
      - report requested goal, desired state when applicable, and terminal outcome first
      - report validation commands and exact results as supporting evidence
      - report local commit SHA and supplied push or PR state
      - state skipped checks, known gaps, risks, and proof ceiling
      - provide one exact next command only when a real external or unproven gate remains
      - use tools/New-SasSprintCapsule.ps1 when a compressed next-agent handoff is needed

outputs:
  tracked:
    - harness/api/operational-harness-manifest.json
    - harness/api/harness-command-registry.json
    - harness/api/harness-validator-registry.json
    - harness/api/harness-artifact-registry.json
    - harness/api/harness-outcome-registry.json
    - harness/api/deployment-state-registry.json
    - harness/workflows/fresh-agent-intake.yaml
    - harness/workflows/outcome-driven-execution.yaml
    - harness/workflows/cybernet-autologon-deployment-state.yaml
    - harness/skills/harness-maintenance/SKILL.md
    - harness/skills/outcome-driven-execution/SKILL.md
    - harness/skills/cybernet-autologon-deployment-state/SKILL.md
    - schemas/harness/operational-harness-manifest.schema.json
    - schemas/harness/harness-outcome-registry.schema.json
    - schemas/harness/deployment-state-registry.schema.json
    - docs/HARNESS_STATUS.md
  generated_local:
    - survey/output/harness-validator/harness-proof-*/
    - survey/output/harness-status/<run-id>/harness-status.md
    - survey/output/<workflow>/<run_id>/operator_handoff.txt
    - survey/output/<workflow>/<run_id>/artifact_registry.json
    - survey/output/<workflow>/<run_id>/review/publish-request.json

proof_ceiling: >-
  Static local repository structure, tracking, schema, workflow, registry, hook, text-policy,
  command-authority, outcome-continuation, deployment-state, and contract proof only; remote publication
  requires the separate operator-approved operational-harness-publish workflow.
