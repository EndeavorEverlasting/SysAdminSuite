schema_version: sas-operator-execution-route-workflow/v1
workflow_id: operator-execution-route
mode: resolve_then_execute
network_activity: workflow_dependent
target_mutation: workflow_dependent
purpose: >-
  Convert a selected canonical command into an executable operator action by first resolving the
  repository/runtime location, proving the registered front door exists there, and then executing
  it in the same turn when the environment can run the command. Never hand an inner product
  command to an operator merely because the command registry selected it.

inputs:
  required:
    - command_id
    - requested_goal
  optional:
    - explicit_target
    - repository_root
    - current_working_directory
    - operator_execution_capable
    - repository_network_authorized

stages:
  - id: select-route
    order: 1
    actions:
      - read harness/api/operator-execution-route-registry.json
      - resolve exactly one route for command_id
      - treat operator_front_door as the operator command when a route exists
      - retain inner_product_command only as implementation context, never as operator handoff text
    stop_conditions:
      - zero or multiple execution routes match the selected command

  - id: prove-freshness
    order: 2
    actions:
      - when current repository behavior is required, apply harness/workflows/repository-freshness-before-launch.yaml
      - do not infer a missing launcher from a stale executing worktree
      - preserve dirty, diverged, default-branch, or separately owned work exactly as the freshness workflow requires

  - id: resolve-location
    order: 3
    actions:
      - never assume the current shell is already inside the repository
      - first resolve the repository root through the installed sas repo command when available
      - otherwise use the bounded cached repo-root.txt value under LOCALAPPDATA
      - normalize the resolved path
      - verify every required_files entry for the selected route beneath that exact root
      - fail closed when the root or any required front-door file cannot be proven
      - do not ask the operator to retype a repository path that the harness can resolve

  - id: execute
    order: 4
    actions:
      - set the shell location to the resolved repository root before invoking a repo-relative front door
      - substitute only the explicit target into operator_command_template
      - when operator_execution_capable is true and authorization/dependencies are satisfied, execute the resolved front door in the same turn
      - propagate the child exit code exactly
      - when the current environment cannot execute on the operator workstation, emit one copy-paste route-and-run command that performs location resolution, front-door verification, Set-Location, invocation, and exit propagation
      - never return only sas autologon Remote HOST when the registered crash-safe front door is available

  - id: artifacts
    order: 5
    actions:
      - preserve the registered success artifact and latest pointer
      - for AutoLogon, use the crash-safe field-run result and last-autologon-field-run.json rather than terminal text as durable proof
      - do not claim live success from route resolution alone

  - id: handoff
    order: 6
    actions:
      - report the resolved execution root when it is known
      - report the exact front door selected
      - report whether execution happened or whether workstation execution is the external blocker
      - if execution is blocked by workstation access, provide the single route-and-run command, not separate cd and inner-command fragments
      - name the expected durable artifact and proof ceiling

proof_ceiling: >-
  Proves operator command selection, execution-location resolution, registered front-door existence,
  and exit propagation. It does not prove target reachability, deployment, restart, sign-in, or
  runtime acceptance unless the selected front door emits the corresponding registered live artifact.
