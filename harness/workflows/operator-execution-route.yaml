schema_version: sas-operator-execution-route-workflow/v1
workflow_id: operator-execution-route
mode: resolve_then_execute
network_activity: workflow_dependent
target_mutation: workflow_dependent
purpose: >-
  Convert a selected canonical command into an executable operator action without assuming the caller's
  working directory or confusing a sealed field runtime with a full repository. For AutoLogon Remote,
  use installed sas only to resolve the sealed runtime, then invoke that runtime's crash-safe bootstrap
  directly. Fall back to the tracked full-repository helper only when installed sas is unavailable.

inputs:
  required:
    - command_id
    - requested_goal
  optional:
    - explicit_target
    - repository_root
    - current_working_directory
    - operator_execution_capable
    - repository_network_authorized

stages:
  - id: select-route
    order: 1
    actions:
      - read harness/api/operator-execution-route-registry.json
      - resolve exactly one route for command_id
      - retain operator_front_door and inner_product_command as route authorities
      - for AutoLogon Remote, treat installed sas as a sealed-runtime locator, not as proof that its own dispatcher is crash-safe
    stop_conditions:
      - zero or multiple execution routes match the selected command

  - id: prove-freshness
    order: 2
    actions:
      - verify repository_freshness_dependency resolves to a tracked file beneath the repository root
      - when current repository behavior is required, apply harness/workflows/repository-freshness-before-launch.yaml
      - do not infer a missing launcher from a stale executing worktree
      - preserve dirty, diverged, default-branch, or separately owned work exactly as the freshness workflow requires

  - id: resolve-location
    order: 3
    actions:
      - never assume the current shell is already inside the repository
      - when installed sas exists for autologon-remote, run sas repo and accept a sealed C:\SASAL runtime that intentionally lacks the full harness tree
      - require Bootstrap-SysAdminSuiteAutoLogon.cmd inside that resolved sealed runtime
      - do not fall through to sas autologon Remote when the sealed crash-safe bootstrap is missing
      - only when installed sas is unavailable, resolve a full repository through the bounded repo-root.txt cache
      - for the full-repository fallback, normalize the root and verify every required_files entry beneath that exact root
      - fail closed when neither a sealed crash-safe runtime nor a proven full-repository fallback is available
      - do not ask the operator to retype a repository path that the harness can resolve

  - id: execute
    order: 4
    actions:
      - require explicit_target when the selected route declares a target_placeholder
      - validate explicit_target against target_validation_pattern before front-door execution
      - encode explicit_target exactly as target_encoding declares; for utf8-base64, substitute only the encoded value into target_placeholder
      - never interpolate the raw explicit_target into PowerShell command source
      - decode and revalidate the target inside the rendered route before either execution path
      - when installed sas is available for autologon-remote, use sas repo to resolve the sealed runtime and invoke Bootstrap-SysAdminSuiteAutoLogon.cmd with the validated target
      - never invoke an installed sas autologon Remote dispatcher from the operator route because installed dispatchers may lag the sealed runtime contract
      - the sealed bootstrap must verify its staging manifest and enter Invoke-SasAutoLogonCrashSafeFieldRun.ps1 so durable field evidence is produced
      - when installed sas is unavailable, invoke the registered operator_helper through powershell.exe -File with the encoded target as a positional argument
      - the fallback helper must decode and revalidate the target, re-read the route registry, and re-prove every required_files dependency before invoking operator_entrypoint
      - when required_network is PROTECTED_NORTHWELL, treat an authenticated live Windows DomainAuthenticated VPN adapter or approved DomainAuthenticated hardwire/LAN as a protected path; the connection type alone is not a failure
      - when operator_execution_capable is true and authorization/dependencies are satisfied, execute in the same turn
      - propagate the child exit code exactly and preserve the operator shell on failure
      - when the current environment cannot execute on the operator workstation, emit one copy-paste route-and-run command
      - a direct sas autologon Remote HOST command is acceptable only after the installed universal launcher itself is proven current and crash-safe; the route does not rely on that assumption

  - id: artifacts
    order: 5
    actions:
      - preserve the registered success artifact and latest pointer
      - for AutoLogon, use the crash-safe field-run result and last-autologon-field-run.json rather than terminal text as durable proof
      - do not claim live success from route resolution alone

  - id: handoff
    order: 6
    actions:
      - report whether the sealed-bootstrap path or the full-repository fallback was selected
      - report the resolved execution root when it is known
      - report whether execution happened or whether workstation execution is the external blocker
      - report the live network/transport classification when it is present in durable evidence
      - if execution is blocked by workstation access, provide one executable command that advances the field gate
      - name the expected durable artifact and proof ceiling

proof_ceiling: >-
  Proves operator command selection, safe target transport, installed-sas sealed-runtime resolution into
  the crash-safe AutoLogon bootstrap or full-repository fallback dependency proof, and exit propagation.
  It does not prove target reachability, deployment, restart, sign-in, or runtime acceptance unless the
  selected product path emits the corresponding registered live artifact.
