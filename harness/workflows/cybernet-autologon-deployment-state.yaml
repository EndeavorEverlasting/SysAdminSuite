schema_version: sas-operational-harness-workflow/v1
workflow_id: cybernet-autologon-deployment-state
mode: execute_to_desired_state
network_activity: workflow_dependent
target_mutation: workflow_dependent
purpose: >-
  Convert AutoLogon and Cybernet field requests into explicit desired workstation states so
  tests, dry runs, transport live certification, installer exit codes, and command acknowledgements
  cannot be mistaken for deployment completion.

inputs:
  required:
    - requested_goal
    - target_profile
  conditional:
    - authorized_target
    - target_mutation_authority
    - clinical_core_state_evidence
    - runtime_proof_config

stages:
  - id: resolve-intent
    order: 1
    actions:
      - read harness/api/deployment-state-registry.json
      - resolve requested_goal to one deployment state before selecting commands
      - treat test AutoLogon as a real one-target apply pilot when an authorized Cybernet target and mutation authority are present
      - treat AutoLogon/Cybernet live-cert apply intent as a deployment chain; transport live certification remains admission only
      - never make runtime proof a prerequisite that delays software deployment completion

  - id: resolve-existing-state
    order: 2
    actions:
      - require the target profile to be Cybernet before any AutoLogon mutation
      - canonicalize the operator target before exact local host-policy eligibility
      - require exact local host-policy eligibility before interrupted-run recovery or apply
      - if approved clinical-core installation or acceptance is already proven, preserve it and skip reinstall
      - read configs/software-packages/approved-apps.json and configs/software-packages/windows-native-package-sets.json for current package disposition
      - verify the five operator-confirmed package source paths against current package ids, folders, and entrypoints
      - require AutoLogon to be the final package in the full profile
      - fail closed if the tracked package truth no longer matches the deployment-state registry

  - id: deploy-full-software
    order: 3
    when: requested goal is cybernet_software_deployed and clinical-core state is not already proven
    actions:
      - use command id cybernet-software-deploy
      - run sas cybernet Deploy HOST
      - require five clinical applications to complete before AutoLogon
      - require AutoLogon as the final software step
      - require artifact id cybernet-software-deployment-result
      - require status CYBERNET_SOFTWARE_DEPLOYMENT_COMPLETED_RESTARTED
      - require automatic_reboot_performed true
      - require restart_offline_observed true and restart_online_observed true

  - id: deploy-autologon-only
    order: 4
    when: clinical-core state is already proven and requested goal requires AutoLogon deployment
    actions:
      - use command id autologon-remote
      - resolve its operator front door through harness/api/terminal-evidence-survival-registry.json
      - run Run-AutoLogonCrashSafe.cmd HOST so terminal loss cannot destroy the outer diagnostic evidence
      - the crash-safe wrapper delegates to the existing Remote product transaction and does not weaken product gates
      - require protected network proof, canonical target resolution, exact local host eligibility, and the per-target lock before recovery or apply
      - the S4U apply engine may emit KERBEROS_S4U_AUTOLOGON_CONFIGURED_REBOOT_PROOF_PENDING as an internal gate
      - do not stop at that intermediate gate
      - require artifact id autologon-field-deployment-result
      - require classification AUTOLOGON_DEPLOYMENT_RESTART_COMPLETED
      - require host_eligibility_proven true
      - require automatic_reboot_performed true
      - require restart_offline_observed true and restart_online_observed true
      - require restart_task_cleanup_verified true
      - require crash-safe field-run result, transcript, child output, recovery output, and latest pointer to remain machine-local and untracked
      - reject deployment_planned, fixture results, transport LIVE CERT PASS, installer exit code alone, process start, or pre-reboot state alone as deployment completion
    stop_conditions:
      - target is not an explicitly authorized Cybernet
      - mutation authority is absent
      - current identity or Kerberos/SMB/S4U gates fail
      - exact local host-policy eligibility fails
      - another field transaction owns the canonical target lock
      - prior durable terminal or ambiguous post-apply evidence requires a stop
      - baseline is dirty or target identity is ambiguous
      - final-step gate fails
      - pre-reboot postconditions fail
      - restart cannot be initiated or restart recovery cannot be observed

  - id: optional-runtime-proof
    order: 5
    when: requested goal explicitly requires autologon_runtime_proven
    actions:
      - runtime proof does not delay deployment completion
      - require the correlated outer restart-complete deployment artifact for the same target
      - run command id autologon-runtime-proof from the actual AutoLogon desktop session
      - require artifact id autologon-technician-runtime-proof
      - require proof_level TECHNICIAN_OBSERVED_LIVE_RUNTIME
      - require runtime_proof true and overall_success true

  - id: handoff
    order: 6
    actions:
      - report desired state first
      - report the exact highest proven state and canonical artifact that proves it
      - list admission tests, crash-safe diagnostic envelope, and inner engine results only as supporting evidence
      - when a terminal vanished, inspect the stable latest pointer and preserved run root before proposing any rerun
      - when blocked, name the smallest real gate and the exact action that advances it
      - never tell the operator to repeat a safe command already executable by the agent

outputs:
  required:
    - requested_goal
    - desired_state
    - highest_proven_state
    - critical_artifact_ids
    - proof_ceiling_reached
  conditional:
    - blocker
    - blocker_owner
    - blocker_action
    - blocker_expected_artifact

proof_ceiling: >-
  This workflow binds software deployment requests to real target mutation. Full Cybernet deployment
  reaches CYBERNET_SOFTWARE_DEPLOYMENT_COMPLETED_RESTARTED; AutoLogon-only deployment reaches
  AUTOLOGON_DEPLOYMENT_RESTART_COMPLETED in the outer field transaction artifact while its crash-safe
  operator envelope persists diagnostics beyond terminal lifetime. Runtime proof is optional higher-ceiling
  evidence and must not delay deployment. Authorization and real target access remain mandatory.
