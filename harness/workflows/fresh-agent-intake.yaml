schema_version: sas-operational-harness-workflow/v1
workflow_id: fresh-agent-intake
mode: local_read_then_route
network_activity: false
target_mutation: false
purpose: >-
  Give a fresh agent one deterministic route from repository intake to the smallest
  authorized workflow, validator set, artifact contract, and next-agent handoff.

inputs:
  required:
    - repository_root
    - current_branch
    - task_request
  optional:
    - owned_scope
    - forbidden_scope
    - supplied_pull_request_metadata

stages:
  - id: governance
    order: 1
    actions:
      - read AGENTS.md without modifying it
      - inspect git status, current branch, worktrees, and supplied pull-request metadata
      - preserve unrelated or separately owned work
    stop_conditions:
      - repository cannot be resolved
      - requested work conflicts with governance or would overwrite unrelated work

  - id: orient
    order: 2
    actions:
      - read CODEBASE_MAP.md
      - read harness/api/operational-harness-manifest.json
      - read harness/api/harness-command-registry.json for canonical build, test, run, and deploy surfaces
      - read harness/api/harness-validator-registry.json for proof selection
      - read harness/api/harness-artifact-registry.json before producing or moving artifacts

  - id: route
    order: 3
    actions:
      - use harness/api/agent-routing-manifest.json for normal task-signal routing
      - when the declared lane is harness infrastructure, load .claude/skills/harness-maintenance/SKILL.md
      - fail closed to .claude/skills/repository-sprint/SKILL.md when routing is unknown or conflicting
      - declare repo, branch, lane, mission, owned scope, forbidden scope, expected artifacts, validators, and proof ceiling before writing

  - id: execute
    order: 4
    actions:
      - use the canonical command or workflow instead of reconstructing implementation details
      - reuse existing maps, registries, schemas, validators, hooks, and skills before creating new authorities
      - keep product mutation outside harness-only sprints
      - keep live or operator-local evidence under ignored output roots

  - id: validate
    order: 5
    actions:
      - python harness/validators/validate-harness-registries.py
      - select additional validators from harness/api/harness-validator-registry.json by changed surface
      - run git diff --check before commit
      - escalate to Pester, managed build, or E2E only when the changed surface or proof ceiling requires it
    failure:
      - stop at the first failed proof boundary
      - classify the failure and repair the smallest owning component
      - rerun the failed validator before broader suites

  - id: artifacts
    order: 6
    actions:
      - resolve output roles and naming through harness/api/harness-artifact-registry.json
      - keep generated evidence untracked unless a registry entry explicitly marks it tracked
      - render the current English harness view with python harness/reports/render-harness-status.py when a human status report is required

  - id: handoff
    order: 7
    actions:
      - name changed files and exact validation results
      - report commit SHA, push state, PR state, skipped checks, gaps, risks, and proof ceiling
      - use tools/New-SasSprintCapsule.ps1 for compressed next-agent transfer when needed
      - provide one exact next command that advances the first remaining unproven gate

outputs:
  tracked_authorities:
    - CODEBASE_MAP.md
    - harness/api/operational-harness-manifest.json
    - harness/api/harness-command-registry.json
    - harness/api/harness-validator-registry.json
    - harness/api/harness-artifact-registry.json
    - .claude/skills/harness-maintenance/SKILL.md
  generated_local:
    - survey/output/<workflow>/<run_id>/artifact_registry.json
    - survey/output/<workflow>/<run_id>/operator_handoff.txt
    - survey/output/<workflow>/<run_id>/review/sprint-capsule.*

proof_ceiling: >-
  Fresh-agent routing, canonical command selection, validator selection, artifact boundaries,
  and handoff structure only. No product, target, deployment, reboot, application, or live-runtime proof.
