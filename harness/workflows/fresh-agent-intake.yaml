schema_version: sas-operational-harness-workflow/v1
workflow_id: fresh-agent-intake
mode: local_read_then_route
network_activity: false
target_mutation: false
purpose: >-
  Give a fresh agent one deterministic route from repository intake to the smallest authorized
  workflow, desired-state contract, validator set, artifact contract, outcome contract, terminal-evidence
  contract, and handoff.

inputs:
  required:
    - repository_root
    - current_branch
    - task_request
    - requested_goal
  optional:
    - owned_scope
    - forbidden_scope
    - supplied_pull_request_metadata
    - explicit_target
    - target_profile
    - existing_state_evidence
    - repository_network_authorized
    - branch_update_authorized
    - default_branch_update_authorized

stages:
  - id: governance
    order: 1
    actions:
      - read AGENTS.md without modifying it
      - inspect git status, current branch, worktrees, and supplied pull-request metadata
      - preserve unrelated or separately owned work
      - when an expected tracked launcher, validator, workflow, registry, or report is missing locally, route through harness/workflows/repository-freshness-before-launch.yaml before command reconstruction
      - when the task depends on current remote repository behavior, route through harness/workflows/repository-freshness-before-launch.yaml before interpreting the executing worktree as repository truth
      - remember that fetching origin/main alone does not update local main or the current worktree
      - remember that freshness routing does not grant repository-network or branch-update authority
      - require repository-network authority before the freshness workflow contacts the configured Git remote
      - preserve the default branch in an isolated worktree unless default-branch update authority is explicit
      - preserve dirty, diverged, or separately owned work with an isolated worktree
      - allow a clean owned non-default branch to use fast-forward-only convergence only when branch-update authority is explicit
    stop_conditions:
      - repository cannot be resolved
      - requested work conflicts with governance or would overwrite unrelated work

  - id: orient
    order: 2
    actions:
      - read CODEBASE_MAP.md
      - read harness/api/operational-harness-manifest.json
      - read harness/api/harness-command-registry.json for canonical build, test, run, and deploy surfaces
      - read harness/api/harness-validator-registry.json for proof selection
      - read harness/api/harness-artifact-registry.json before producing or moving artifacts
      - read harness/api/harness-outcome-registry.json before treating any validator, dry run, plan, build, deploy, or runtime command as terminal
      - read harness/api/terminal-evidence-survival-registry.json before executing or recovering a registered terminal-sensitive field command
      - when AutoLogon, Cybernet, live cert, deployment, or runtime proof is involved, read harness/api/deployment-state-registry.json before selecting the command chain

  - id: route
    order: 3
    actions:
      - use harness/api/agent-routing-manifest.json for normal task-signal routing
      - when the declared lane is harness infrastructure, load harness/skills/harness-maintenance/SKILL.md
      - when the requested goal extends beyond validation or planning, load harness/skills/outcome-driven-execution/SKILL.md after normal task routing
      - for AutoLogon/Cybernet test, live-cert, deployment, or runtime-proof work, load harness/skills/cybernet-autologon-deployment-state/SKILL.md after the normal P00 route is selected
      - for a vanished, closed, crashed, interrupted, or terminal-sensitive registered field command, load harness/skills/terminal-evidence-survival/SKILL.md before choosing the operator entrypoint
      - resolve desired product/runtime state before interpreting test, live cert, deploy, or runtime-proof wording
      - fail closed to .claude/skills/repository-sprint/SKILL.md when routing is unknown or conflicting
      - declare repo, branch, lane, mission, owned scope, forbidden scope, artifacts, validators, requested goal, desired state when applicable, and proof ceiling before writing

  - id: execute
    order: 4
    actions:
      - use the canonical command or workflow instead of reconstructing implementation details
      - reuse existing maps, registries, schemas, validators, hooks, and skills before creating new authorities
      - keep product mutation outside harness-only sprints
      - keep live or operator-local evidence under ignored output roots
      - treat validators, dry runs, plans, fixtures, and harmless transport live certs as admission gates when the requested goal remains unproven
      - for an authorized Cybernet AutoLogon apply/test/live-cert goal, do not substitute transport proof for the real autologon-remote state transition
      - when command id autologon-remote is executed by an operator, use the registered Run-AutoLogonCrashSafe.cmd HOST front door rather than handing out the inner product command
      - when a terminal vanished, recover the stable latest pointer and local artifacts before any target re-contact or rerun
      - preserve already-proven Cybernet clinical-core installation/acceptance instead of blindly reinstalling it to reach AutoLogon
      - follow registered same-turn continuations instead of handing safe executable work back to the operator

  - id: validate
    order: 5
    actions:
      - python harness/validators/validate-harness-registries.py
      - python harness/validators/validate-repository-freshness-contracts.py
      - python harness/validators/validate-outcome-contracts.py
      - python harness/validators/validate-deployment-state-contracts.py
      - python harness/validators/validate-terminal-evidence-survival.py when terminal-evidence routing, artifacts, hooks, runner contracts, or front doors change
      - select additional validators from harness/api/harness-validator-registry.json by changed surface
      - run git diff --check before commit
      - escalate to Pester, managed build, or E2E only when the changed surface or proof ceiling requires it
    failure:
      - stop at the first failed proof boundary
      - classify the failure and repair the smallest owning component
      - rerun the failed validator before broader suites

  - id: artifacts
    order: 6
    actions:
      - resolve output roles and naming through harness/api/harness-artifact-registry.json
      - resolve success and continuation behavior through harness/api/harness-outcome-registry.json
      - resolve terminal-sensitive stable evidence and offline recovery through harness/api/terminal-evidence-survival-registry.json
      - resolve AutoLogon/Cybernet critical state artifacts through harness/api/deployment-state-registry.json
      - keep generated evidence untracked unless a registry entry explicitly marks it tracked
      - render the current English harness view with python harness/reports/render-harness-status.py when a human status report is required

  - id: handoff
    order: 7
    actions:
      - report requested goal, desired state when applicable, and terminal outcome before intermediate validation details
      - name changed files and exact validation results
      - report commit SHA, push state, PR state, skipped checks, gaps, risks, and proof ceiling
      - use tools/New-SasSprintCapsule.ps1 for compressed next-agent transfer when needed
      - provide one exact next command only when a real unproven gate remains
      - when AutoLogon deployment is proven and runtime remains requested, identify the separately authorized attended reboot/direct sign-in gate rather than returning to more tests
      - when a terminal vanished, report the preserved latest pointer and run root before proposing any new target action
      - never stop at tests passed, transport live cert passed, status reported, command printed, or wait for next chat when a registered safe continuation remains executable

outputs:
  tracked_authorities:
    - CODEBASE_MAP.md
    - harness/api/operational-harness-manifest.json
    - harness/api/harness-command-registry.json
    - harness/api/harness-validator-registry.json
    - harness/api/harness-artifact-registry.json
    - harness/api/harness-outcome-registry.json
    - harness/api/deployment-state-registry.json
    - harness/api/terminal-evidence-survival-registry.json
    - harness/workflows/repository-freshness-before-launch.yaml
    - harness/skills/harness-maintenance/SKILL.md
    - harness/skills/outcome-driven-execution/SKILL.md
    - harness/skills/cybernet-autologon-deployment-state/SKILL.md
    - harness/skills/terminal-evidence-survival/SKILL.md
  generated_local:
    - survey/output/<workflow>/<run_id>/artifact_registry.json
    - survey/output/<workflow>/<run_id>/operator_handoff.txt
    - survey/output/<workflow>/<run_id>/review/sprint-capsule.*
    - %LOCALAPPDATA%/SysAdminSuite/last-autologon-field-run.json

proof_ceiling: >-
  Fresh-agent routing, authorized repository-freshness selection, desired-state selection, canonical command
  and terminal-evidence front-door selection, validator selection, artifact boundaries, outcome continuation,
  and handoff structure only. Intake itself creates no product, target, deployment, reboot, application, or
  live-runtime proof.
