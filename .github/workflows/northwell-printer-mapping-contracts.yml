name: Northwell printer mapping contracts

permissions:
  contents: read

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'repair/**']
    paths:
      - 'AGENTS.md'
      - '.claude/skills/field-workflow/**'
      - 'START-HERE-NORTHWELL-PRINTER-MAPPING.md'
      - 'Map-NorthwellPrinter-SystemWide.cmd'
      - 'Map-NorthwellPrinters-FromFile.cmd'
      - 'Edit-NorthwellPrinter-Defaults.cmd'
      - 'Edit-NorthwellPrinter-Batch.cmd'
      - 'Map-NorthwellPrinters-Batch.cmd'
      - 'Config/interaction-cache-policy.json'
      - 'mapping/README.md'
      - 'mapping/Start-NorthwellPrinterMapping.ps1'
      - 'mapping/Start-NorthwellPrinterBatch.ps1'
      - 'mapping/Examples/NorthwellPrinterBatch.example.csv'
      - 'mapping/Examples/NorthwellPrinterDefaults.example.json'
      - 'mapping/Invoke-NorthwellPrinterMapping.ps1'
      - 'mapping/Modules/NorthwellPrinterMapping.Core.psm1'
      - 'scripts/SasInteractionCache.psm1'
      - 'scripts/SasNetworkGuard.psm1'
      - 'scripts/Repair-SasVpnDomainAuthNetworkGuardRuntime.ps1'
      - 'harness/api/northwell-printer-mapping-evidence-policy.json'
      - 'Utilities/Map-Printer.ps1'
      - 'Tests/Pester/NorthwellPrinterMapping.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterInteractionCache.Tests.ps1'
      - 'Tests/Pester/SasInteractionCache.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterLowNoiseAcceptance.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterTimeoutRegression.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterMappingCollisionRepair.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterNetworkGuard.Tests.ps1'
      - '.github/workflows/northwell-printer-mapping-contracts.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.claude/skills/field-workflow/**'
      - 'START-HERE-NORTHWELL-PRINTER-MAPPING.md'
      - 'Map-NorthwellPrinter-SystemWide.cmd'
      - 'Map-NorthwellPrinters-FromFile.cmd'
      - 'Edit-NorthwellPrinter-Defaults.cmd'
      - 'Edit-NorthwellPrinter-Batch.cmd'
      - 'Map-NorthwellPrinters-Batch.cmd'
      - 'Config/interaction-cache-policy.json'
      - 'mapping/README.md'
      - 'mapping/Start-NorthwellPrinterMapping.ps1'
      - 'mapping/Start-NorthwellPrinterBatch.ps1'
      - 'mapping/Examples/NorthwellPrinterBatch.example.csv'
      - 'mapping/Examples/NorthwellPrinterDefaults.example.json'
      - 'mapping/Invoke-NorthwellPrinterMapping.ps1'
      - 'mapping/Modules/NorthwellPrinterMapping.Core.psm1'
      - 'scripts/SasInteractionCache.psm1'
      - 'scripts/SasNetworkGuard.psm1'
      - 'scripts/Repair-SasVpnDomainAuthNetworkGuardRuntime.ps1'
      - 'harness/api/northwell-printer-mapping-evidence-policy.json'
      - 'Utilities/Map-Printer.ps1'
      - 'Tests/Pester/NorthwellPrinterMapping.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterInteractionCache.Tests.ps1'
      - 'Tests/Pester/SasInteractionCache.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterLowNoiseAcceptance.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterTimeoutRegression.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterMappingCollisionRepair.Tests.ps1'
      - 'Tests/Pester/NorthwellPrinterNetworkGuard.Tests.ps1'
      - '.github/workflows/northwell-printer-mapping-contracts.yml'
      - '.gitignore'

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse PowerShell surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            '.\mapping\Start-NorthwellPrinterMapping.ps1',
            '.\mapping\Start-NorthwellPrinterBatch.ps1',
            '.\mapping\Invoke-NorthwellPrinterMapping.ps1',
            '.\mapping\Modules\NorthwellPrinterMapping.Core.psm1',
            '.\scripts\SasInteractionCache.psm1',
            '.\scripts\SasNetworkGuard.psm1',
            '.\scripts\Repair-SasVpnDomainAuthNetworkGuardRuntime.ps1',
            '.\Utilities\Map-Printer.ps1',
            '.\Tests\Pester\NorthwellPrinterMapping.Tests.ps1',
            '.\Tests\Pester\NorthwellPrinterInteractionCache.Tests.ps1',
            '.\Tests\Pester\SasInteractionCache.Tests.ps1',
            '.\Tests\Pester\NorthwellPrinterLowNoiseAcceptance.Tests.ps1',
            '.\Tests\Pester\NorthwellPrinterTimeoutRegression.Tests.ps1',
            '.\Tests\Pester\NorthwellPrinterMappingCollisionRepair.Tests.ps1',
            '.\Tests\Pester\NorthwellPrinterNetworkGuard.Tests.ps1'
          )
          $allErrors = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $allErrors += $errors | ForEach-Object { "$file :: $($_.Message)" } }
          }
          if ($allErrors.Count -gt 0) { throw ($allErrors -join [Environment]::NewLine) }
          Write-Host 'PASS: Northwell printer PowerShell surfaces parse.'

      - name: Validate tracked examples are synthetic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rows = @(Import-Csv -LiteralPath '.\mapping\Examples\NorthwellPrinterBatch.example.csv')
          if ($rows.Count -ne 1) { throw 'Tracked batch example must contain exactly one starter row.' }
          foreach ($column in @('ComputerName','PrintServer','QueueName')) {
            if ($null -eq $rows[0].PSObject.Properties[$column]) { throw "Missing batch example column: $column" }
          }
          if ($rows[0].ComputerName -ne 'REPLACE-WITH-PC-HOSTNAME' -or
              $rows[0].PrintServer -ne 'REPLACE-WITH-PRINT-SERVER' -or
              $rows[0].QueueName -ne 'REPLACE-WITH-QUEUE-NAME') {
            throw 'Tracked batch example must contain synthetic REPLACE-WITH-* values only.'
          }
          $defaults = Get-Content -LiteralPath '.\mapping\Examples\NorthwellPrinterDefaults.example.json' -Raw | ConvertFrom-Json
          if ($defaults.PrintServer -ne 'REPLACE-WITH-PRINT-SERVER' -or $defaults.QueueName -ne 'REPLACE-WITH-QUEUE-NAME') {
            throw 'Tracked printer-default example must contain synthetic REPLACE-WITH-* values only.'
          }
          Write-Host 'PASS: tracked Northwell printer examples are synthetic.'

      - name: Parse printer mapping evidence policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Get-Content -LiteralPath '.\harness\api\northwell-printer-mapping-evidence-policy.json' -Raw | ConvertFrom-Json
          if ($policy.schema_version -ne 'sas-northwell-printer-mapping-evidence/v1') { throw "Unexpected printer mapping evidence schema: $($policy.schema_version)" }
          Write-Host 'PASS: printer mapping evidence policy parses.'

      - name: Validate interaction cache policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Get-Content -LiteralPath '.\Config\interaction-cache-policy.json' -Raw | ConvertFrom-Json
          if ($policy.schemaVersion -ne 'sas-interaction-cache-policy/v1') { throw "Unexpected interaction cache policy schema: $($policy.schemaVersion)" }
          if ($policy.cacheSchemaVersion -ne 'sas-interaction-cache/v1') { throw "Unexpected interaction cache schema: $($policy.cacheSchemaVersion)" }
          if ([int]$policy.freshness.ttlDays -lt 1) { throw 'Interaction cache TTL must be positive.' }
          if ([int]$policy.capacity.maxEntriesPerKind -gt [int]$policy.capacity.maxEntries) { throw 'Per-kind cache bound cannot exceed total capacity.' }
          if ([bool]$policy.storage.authoritative) { throw 'Interaction cache must remain non-authoritative.' }
          if ([bool]$policy.security.secretsAllowed) { throw 'Interaction cache policy must prohibit secrets.' }
          if ($policy.failureBehavior.cacheUnavailable -ne 'continue-to-authoritative-origin') { throw 'Cache outage must fail open to the authoritative path.' }
          Write-Host 'PASS: interaction cache policy is bounded, non-authoritative, and fail-open.'

      - name: Install Pester 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) { Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.5.0 }

      - name: Run targeted printer contracts
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\Test-Pester5Suite.ps1
          -TestPath .\Tests\Pester\NorthwellPrinterMapping.Tests.ps1

      - name: Run interaction cache consistency contracts
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\Test-Pester5Suite.ps1
          -TestPath .\Tests\Pester\SasInteractionCache.Tests.ps1

      - name: Run printer cached UX contracts
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\Test-Pester5Suite.ps1
          -TestPath .\Tests\Pester\NorthwellPrinterInteractionCache.Tests.ps1

      - name: Run low-noise field acceptance contracts
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\Test-Pester5Suite.ps1
          -TestPath .\Tests\Pester\NorthwellPrinterLowNoiseAcceptance.Tests.ps1

      - name: Run printer timeout regression contracts
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\Test-Pester5Suite.ps1
          -TestPath .\Tests\Pester\NorthwellPrinterTimeoutRegression.Tests.ps1

      - name: Run printer mapping evidence precedence contracts
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\Test-Pester5Suite.ps1
          -TestPath .\Tests\Pester\NorthwellPrinterMappingCollisionRepair.Tests.ps1

      - name: Run printer VPN network authority contracts
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\Test-Pester5Suite.ps1
          -TestPath .\Tests\Pester\NorthwellPrinterNetworkGuard.Tests.ps1

      - name: Check pull-request patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" --depth=1
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Check pushed commit whitespace
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            git fetch origin "${{ github.sha }}" --depth=2
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then git diff --check HEAD^ HEAD; else git show --check --oneline --no-renames HEAD; fi
          else
            git fetch origin "$before" "${{ github.sha }}" --depth=1
            git diff --check "$before" "${{ github.sha }}"
          fi
