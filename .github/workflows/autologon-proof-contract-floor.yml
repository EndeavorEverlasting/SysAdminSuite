name: AutoLogon Proof Contract Floor

on:
  pull_request:
    paths:
      - '.github/workflows/autologon-proof-contract-floor.yml'
      - 'schemas/harness/autologon-*.schema.json'
      - 'harness/api/autologon-artifact-types.json'
      - 'harness/api/sas-harness-api.json'
      - 'harness/workflows/autologon-proof-contract-floor.yaml'
      - 'Tests/Fixtures/autologon-contract-floor/**'
      - 'Tests/survey/test_autologon_proof_contract_floor_contracts.py'
      - 'Tests/survey/test_autologon_kerberos_s4u_contracts.py'
      - 'Tests/survey/test_autologon_s4u_field_hardening_contracts.py'
      - 'Tests/survey/test_autologon_interrupted_recovery_orchestration_contracts.py'
      - 'Tests/survey/test_autologon_exact_run_root_cleanup_contracts.py'
      - 'Tests/survey/test_autologon_intent_only_baseline_contracts.py'
      - 'Tests/survey/test_software_source_identity_contracts.py'
      - 'Tests/survey/test_sas_operator_refresh_contracts.py'
      - 'Tests/survey/test_operator_network_return_contracts.py'
      - 'scripts/Invoke-SasAutoLogonKerberosS4UPilot.ps1'
      - 'scripts/Invoke-SasAutoLogonS4URestartDeployment.ps1'
      - 'scripts/Invoke-SasAutoLogonOnsite.ps1'
      - 'scripts/Recover-SasLatestInterruptedAutoLogonS4U.ps1'
      - 'scripts/Complete-SasInterruptedAutoLogonS4URecovery.ps1'
      - 'scripts/Remove-SasExactRemoteAutoLogonRunRoot.ps1'
      - 'scripts/SasBoundedNative.psm1'
      - 'scripts/SasSoftwareSourceIdentity.psm1'
      - 'scripts/SasAutoLogonBaselinePolicy.psm1'
      - 'scripts/Refresh-SasOperatorCommand.ps1'
      - 'scripts/Return-SasOperatorToPreviousNetwork.ps1'
      - 'scripts/SasPortableLauncher.ps1'
      - 'scripts/Install-SasPortableLauncher.ps1'
      - 'Run-AutoLogonOnsite.cmd'
      - 'Switch-Back-To-Previous-Network.cmd'
      - 'tests/survey/run_offline_survey_tests.sh'
      - 'docs/AUTOLOGON_PROOF_CONTRACT_FLOOR.md'
      - 'docs/handoff/autologon-s4u-field-hardening-2026-07-30.md'
      - 'CODEBASE_MAP.md'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-floor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run dependency-free AutoLogon proof contracts
        run: python3 Tests/survey/test_autologon_proof_contract_floor_contracts.py

      - name: Run AutoLogon field-hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/survey/test_autologon_kerberos_s4u_contracts.py
          python3 Tests/survey/test_autologon_s4u_field_hardening_contracts.py
          python3 Tests/survey/test_autologon_interrupted_recovery_orchestration_contracts.py
          python3 Tests/survey/test_autologon_exact_run_root_cleanup_contracts.py
          python3 Tests/survey/test_autologon_intent_only_baseline_contracts.py
          python3 Tests/survey/test_software_source_identity_contracts.py

      - name: Run operator field-friction contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/survey/test_sas_operator_refresh_contracts.py
          python3 Tests/survey/test_operator_network_return_contracts.py

      - name: Install JSON Schema validator
        run: python -m pip install jsonschema

      - name: Re-run with Draft 2020-12 schema validation
        run: python3 Tests/survey/test_autologon_proof_contract_floor_contracts.py

      - name: Verify JSON parsing
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path('schemas/harness').glob('autologon-*.schema.json'))
          paths += list(Path('Tests/Fixtures/autologon-contract-floor').glob('*.json'))
          paths += [Path('harness/api/autologon-artifact-types.json'), Path('harness/api/sas-harness-api.json')]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'JSON PARSE PASS: {len(paths)} files')
          PY
