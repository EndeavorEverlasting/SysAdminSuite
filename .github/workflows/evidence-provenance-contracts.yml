name: Evidence Provenance Reuse Contracts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'harness/api/evidence-provenance-registry.json'
      - 'schemas/harness/evidence-provenance-registry.schema.json'
      - 'harness/api/evidence_provenance_policy.py'
      - 'harness/validators/validate-evidence-provenance-contracts.py'
      - 'Tests/survey/test_evidence_provenance_reuse_contracts.py'
      - 'Tests/survey/test_hh_cc_reader_field_probe_contracts.py'
      - 'docs/HH_CC_READER_NETSTAT_BASELINE.md'
      - '.claude/skills/field-workflow/SKILL.md'
      - 'harness/api/harness-validator-registry.json'
      - 'harness/api/operational-harness-manifest.json'
      - '.githooks/**'
      - 'tests/survey/run_offline_survey_tests.sh'
      - '.github/workflows/evidence-provenance-contracts.yml'
  push:
    branches: [main, 'feat/**', 'repair/**', 'fix/**', 'harness/**']
    paths:
      - 'harness/api/evidence-provenance-registry.json'
      - 'schemas/harness/evidence-provenance-registry.schema.json'
      - 'harness/api/evidence_provenance_policy.py'
      - 'harness/validators/validate-evidence-provenance-contracts.py'
      - 'Tests/survey/test_evidence_provenance_reuse_contracts.py'
      - 'Tests/survey/test_hh_cc_reader_field_probe_contracts.py'
      - 'docs/HH_CC_READER_NETSTAT_BASELINE.md'
      - '.claude/skills/field-workflow/SKILL.md'
      - 'harness/api/harness-validator-registry.json'
      - 'harness/api/operational-harness-manifest.json'
      - '.githooks/**'
      - 'tests/survey/run_offline_survey_tests.sh'
      - '.github/workflows/evidence-provenance-contracts.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Compile focused validator
        run: python -m py_compile harness/validators/validate-evidence-provenance-contracts.py harness/api/evidence_provenance_policy.py Tests/survey/test_evidence_provenance_reuse_contracts.py
      - name: Validate evidence provenance registry schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          document = json.loads(Path('harness/api/evidence-provenance-registry.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('schemas/harness/evidence-provenance-registry.schema.json').read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator(schema).validate(document)
          print('PASS: evidence provenance registry schema')
          PY
      - name: Validate evidence provenance reuse contracts
        run: python harness/validators/validate-evidence-provenance-contracts.py
      - name: Validate provenance reuse fixtures
        run: python Tests/survey/test_evidence_provenance_reuse_contracts.py
      - name: Validate H&H reader probe contracts
        run: python Tests/survey/test_hh_cc_reader_field_probe_contracts.py
      - name: Validate operational harness completeness
        run: python Tests/survey/test_operational_harness_completeness_contracts.py
      - name: Validate harness registries
        run: python harness/validators/validate-harness-registries.py
      - name: Run blocking offline survey floor
        run: bash tests/survey/run_offline_survey_tests.sh
      - name: Check pull-request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed whitespace
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            git show --check --oneline --no-renames HEAD
          else
            git diff --check "$before" "${{ github.sha }}"
          fi
      - name: Check manual-dispatch whitespace
        if: github.event_name == 'workflow_dispatch'
        run: git show --check --oneline --no-renames HEAD
