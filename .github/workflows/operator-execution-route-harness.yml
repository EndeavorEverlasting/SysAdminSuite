name: Operator Execution Route Harness

on:
  pull_request:
    paths:
      - 'harness/api/operator-execution-route-registry.json'
      - 'harness/api/operational-harness-manifest.json'
      - 'harness/api/harness-validator-registry.json'
      - 'schemas/harness/operator-execution-route-registry.schema.json'
      - 'schemas/harness/operational-harness-manifest.schema.json'
      - 'harness/workflows/operator-execution-route.yaml'
      - 'harness/workflows/repository-freshness-before-launch.yaml'
      - 'harness/workflows/fresh-agent-intake.yaml'
      - 'harness/skills/operator-execution-route/**'
      - 'harness/maps/OPERATOR_EXECUTION_ROUTE_MAP.md'
      - 'harness/reports/OPERATOR_EXECUTION_ROUTE_STATUS.md'
      - 'harness/validators/validate-operator-execution-route.py'
      - 'harness/scripts/Invoke-SasOperatorExecutionRoute.ps1'
      - 'Tests/PowerShell/OperatorExecutionRouteHarness.Tests.ps1'
      - 'Tests/survey/test_universal_field_platform_contracts.py'
      - 'harness/api/harness-command-registry.json'
      - 'harness/api/terminal-evidence-survival-registry.json'
      - 'Run-AutoLogonCrashSafe.cmd'
      - 'Run-AutoLogonOnsite.cmd'
      - 'Bootstrap-SysAdminSuiteAutoLogon.cmd'
      - 'Bootstrap-SysAdminSuiteAutoLogon.ps1'
      - 'scripts/SasPortableLauncher.ps1'
      - 'scripts/SasNetworkIntent.psm1'
      - 'scripts/Invoke-SasNetworkAwareField.ps1'
      - 'scripts/Invoke-SasUniversalField.ps1'
      - 'scripts/Install-SasUniversalFieldLauncher.ps1'
      - 'scripts/Invoke-SasAutoLogonOnsite.ps1'
      - 'scripts/Invoke-SasAutoLogonCrashSafeFieldRun.ps1'
      - 'scripts/Invoke-SasAutoLogonFieldDeployment.ps1'
      - '.githooks/pre-commit'
      - '.githooks/pre-push'
      - '.github/workflows/operator-execution-route-harness.yml'
      - '.github/workflows/universal-field-platform.yml'
  push:
    branches: [main]
    paths:
      - 'harness/api/operator-execution-route-registry.json'
      - 'harness/api/operational-harness-manifest.json'
      - 'harness/api/harness-validator-registry.json'
      - 'schemas/harness/operator-execution-route-registry.schema.json'
      - 'schemas/harness/operational-harness-manifest.schema.json'
      - 'harness/workflows/operator-execution-route.yaml'
      - 'harness/workflows/repository-freshness-before-launch.yaml'
      - 'harness/workflows/fresh-agent-intake.yaml'
      - 'harness/skills/operator-execution-route/**'
      - 'harness/maps/OPERATOR_EXECUTION_ROUTE_MAP.md'
      - 'harness/reports/OPERATOR_EXECUTION_ROUTE_STATUS.md'
      - 'harness/validators/validate-operator-execution-route.py'
      - 'harness/scripts/Invoke-SasOperatorExecutionRoute.ps1'
      - 'Tests/PowerShell/OperatorExecutionRouteHarness.Tests.ps1'
      - 'Tests/survey/test_universal_field_platform_contracts.py'
      - 'Run-AutoLogonCrashSafe.cmd'
      - 'Run-AutoLogonOnsite.cmd'
      - 'Bootstrap-SysAdminSuiteAutoLogon.cmd'
      - 'Bootstrap-SysAdminSuiteAutoLogon.ps1'
      - 'scripts/SasPortableLauncher.ps1'
      - 'scripts/SasNetworkIntent.psm1'
      - 'scripts/Invoke-SasNetworkAwareField.ps1'
      - 'scripts/Invoke-SasUniversalField.ps1'
      - 'scripts/Install-SasUniversalFieldLauncher.ps1'
      - 'scripts/Invoke-SasAutoLogonOnsite.ps1'
      - 'scripts/Invoke-SasAutoLogonCrashSafeFieldRun.ps1'
      - 'scripts/Invoke-SasAutoLogonFieldDeployment.ps1'
      - '.githooks/pre-commit'
      - '.githooks/pre-push'
      - '.github/workflows/operator-execution-route-harness.yml'
      - '.github/workflows/universal-field-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Validate operator execution route
        run: python harness/validators/validate-operator-execution-route.py
      - name: Validate universal field AutoLogon route
        run: python Tests/survey/test_universal_field_platform_contracts.py
      - name: Validate harness registries
        run: python harness/validators/validate-harness-registries.py
      - name: Validate operational harness completeness
        run: python Tests/survey/test_operational_harness_completeness_contracts.py
      - name: Validate patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Validate commit whitespace
        if: github.event_name != 'pull_request'
        run: git diff --check HEAD^ HEAD

  windows-route:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute route-and-run template under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Tests\PowerShell\OperatorExecutionRouteHarness.Tests.ps1
