name: Printer mapping use-case contracts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.claude/skills/field-workflow/SKILL.md'
      - 'harness/api/printer-mapping-use-case-registry.json'
      - 'harness/api/operational-harness-manifest.json'
      - 'harness/api/harness-validator-registry.json'
      - 'harness/workflows/printer-mapping-use-case-routing.yaml'
      - 'harness/workflows/fresh-agent-intake.yaml'
      - 'harness/skills/printer-mapping-use-case-routing/**'
      - 'harness/maps/PRINTER_MAPPING_USE_CASE_MAP.md'
      - 'harness/reports/PRINTER_MAPPING_USE_CASES.md'
      - 'harness/validators/validate-printer-mapping-use-cases.py'
      - 'schemas/harness/printer-mapping-use-case-registry.schema.json'
      - 'schemas/harness/operational-harness-manifest.schema.json'
      - 'Tests/survey/test_printer_mapping_use_case_contracts.py'
      - 'Tests/survey/test_operational_harness_completeness_contracts.py'
      - '.githooks/pre-commit'
      - '.githooks/pre-push'
      - '.github/workflows/printer-mapping-use-case-contracts.yml'
  push:
    branches: [main, 'feat/**', 'fix/**', 'harness/**']
    paths:
      - '.claude/skills/field-workflow/SKILL.md'
      - 'harness/api/printer-mapping-use-case-registry.json'
      - 'harness/api/operational-harness-manifest.json'
      - 'harness/api/harness-validator-registry.json'
      - 'harness/workflows/printer-mapping-use-case-routing.yaml'
      - 'harness/workflows/fresh-agent-intake.yaml'
      - 'harness/skills/printer-mapping-use-case-routing/**'
      - 'harness/maps/PRINTER_MAPPING_USE_CASE_MAP.md'
      - 'harness/reports/PRINTER_MAPPING_USE_CASES.md'
      - 'harness/validators/validate-printer-mapping-use-cases.py'
      - 'schemas/harness/printer-mapping-use-case-registry.schema.json'
      - 'schemas/harness/operational-harness-manifest.schema.json'
      - 'Tests/survey/test_printer_mapping_use_case_contracts.py'
      - 'Tests/survey/test_operational_harness_completeness_contracts.py'
      - '.githooks/pre-commit'
      - '.githooks/pre-push'
      - '.github/workflows/printer-mapping-use-case-contracts.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install jsonschema

      - name: Compile focused harness surfaces
        run: >-
          python -m py_compile
          harness/validators/validate-printer-mapping-use-cases.py
          Tests/survey/test_printer_mapping_use_case_contracts.py

      - name: Validate printer mapping registry schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          document = json.loads(Path('harness/api/printer-mapping-use-case-registry.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('schemas/harness/printer-mapping-use-case-registry.schema.json').read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator(schema).validate(document)
          print('PASS: printer-mapping use-case registry schema')
          PY

      - name: Validate printer mapping use-case isolation
        run: python harness/validators/validate-printer-mapping-use-cases.py

      - name: Run focused printer mapping contracts
        run: python Tests/survey/test_printer_mapping_use_case_contracts.py

      - name: Run operational harness completeness
        run: python Tests/survey/test_operational_harness_completeness_contracts.py

      - name: Check hook syntax
        run: bash -n .githooks/pre-commit .githooks/pre-push

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Check pushed whitespace
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            git show --check --oneline --no-renames HEAD
          else
            git diff --check "$before" "${{ github.sha }}"
          fi
