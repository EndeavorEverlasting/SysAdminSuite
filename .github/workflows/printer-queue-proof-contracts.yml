name: Printer queue proof contracts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'Prove-NorthwellPrinter-Queue.cmd'
      - 'scripts/Invoke-SasNorthwellPrinterQueueProof.ps1'
      - 'harness/api/copy-safe-operator-command-policy.json'
      - 'harness/validators/validate-copy-safe-operator-commands.py'
      - 'Tests/survey/test_northwell_printer_queue_proof_contracts.py'
      - 'docs/COPY_SAFE_OPERATOR_COMMANDS.md'
      - '.github/workflows/printer-queue-proof-contracts.yml'
  push:
    branches: [main, 'feat/**', 'repair/**']
    paths:
      - 'Prove-NorthwellPrinter-Queue.cmd'
      - 'scripts/Invoke-SasNorthwellPrinterQueueProof.ps1'
      - 'harness/api/copy-safe-operator-command-policy.json'
      - 'harness/validators/validate-copy-safe-operator-commands.py'
      - 'Tests/survey/test_northwell_printer_queue_proof_contracts.py'
      - 'docs/COPY_SAFE_OPERATOR_COMMANDS.md'
      - '.github/workflows/printer-queue-proof-contracts.yml'

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate copy-safe harness policy
        shell: pwsh
        run: python .\harness\validators\validate-copy-safe-operator-commands.py

      - name: Run printer queue proof contracts
        shell: pwsh
        run: python .\Tests\survey\test_northwell_printer_queue_proof_contracts.py

      - name: Parse Windows PowerShell 5.1 proof engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath '.\scripts\Invoke-SasNorthwellPrinterQueueProof.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object { $_.Message } | Out-String)
          }
          Write-Host 'PASS: printer queue proof engine parses under Windows PowerShell 5.1.'

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" --depth=1
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git show --check --oneline --no-renames HEAD
          fi
