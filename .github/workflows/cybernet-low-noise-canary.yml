name: Cybernet Low-Noise Canary

on:
  pull_request:
    paths:
      - 'survey/sas-cybernet-canary.ps1'
      - 'survey/sas-network-preflight.ps1'
      - 'Config/low-noise-policy.json'
      - 'scripts/SasLowNoisePolicy.psm1'
      - 'scripts/SasNetworkGuard.psm1'
      - 'scripts/SasTargetIntake.psm1'
      - 'scripts/Invoke-SasUniversalField.ps1'
      - 'scripts/Invoke-SasNetworkAwareField.ps1'
      - 'scripts/Install-SasUniversalFieldLauncher.ps1'
      - 'Tests/Pester/CybernetLowNoiseCanary.Tests.ps1'
      - 'docs/CYBERNET_LOW_NOISE_CANARY.md'
      - 'harness/maps/CYBERNET_HARDWARE_IDENTITY_MAP.md'
      - '.github/workflows/cybernet-low-noise-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run canary contracts
        shell: powershell
        run: .\tools\Test-Pester5Suite.ps1 -TestPath .\Tests\Pester\CybernetLowNoiseCanary.Tests.ps1
      - name: Parse canary and launcher surfaces under Windows PowerShell
        shell: powershell
        run: |
          $paths = @('.\survey\sas-cybernet-canary.ps1','.\scripts\Invoke-SasUniversalField.ps1','.\scripts\Invoke-SasNetworkAwareField.ps1','.\scripts\Install-SasUniversalFieldLauncher.ps1')
          foreach ($path in $paths) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if (@($errors).Count) { throw "$path parse errors: $($errors[0].Message)" }
          }

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check pull-request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/$BASE_REF...HEAD"
      - name: Check manual-run tip whitespace
        if: github.event_name == 'workflow_dispatch'
        run: git diff --check HEAD^..HEAD
