name: Machine info technician launcher

on:
  pull_request:
    paths:
      - 'Get-MachineInfo.cmd'
      - 'GetInfo/Get-MachineInfo.ps1'
      - 'scripts/Invoke-SasMachineInfo.ps1'
      - 'scripts/Invoke-SasUniversalField.ps1'
      - 'scripts/Invoke-SasNetworkAwareField.ps1'
      - 'scripts/Install-SasUniversalFieldLauncher.ps1'
      - 'docs/MACHINE_INFO_CMD.md'
      - 'Tests/survey/test_machine_info_cmd_contracts.py'
      - 'Tests/survey/test_field_guide_cmd_first_contracts.py'
      - 'tests/survey/run_offline_survey_tests.sh'
      - '.github/workflows/machine-info-cmd-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'Get-MachineInfo.cmd'
      - 'GetInfo/Get-MachineInfo.ps1'
      - 'scripts/Invoke-SasMachineInfo.ps1'
      - 'scripts/Invoke-SasUniversalField.ps1'
      - 'scripts/Invoke-SasNetworkAwareField.ps1'
      - 'scripts/Install-SasUniversalFieldLauncher.ps1'
      - 'docs/MACHINE_INFO_CMD.md'
      - 'Tests/survey/test_machine_info_cmd_contracts.py'
      - 'Tests/survey/test_field_guide_cmd_first_contracts.py'
      - 'tests/survey/run_offline_survey_tests.sh'
      - '.github/workflows/machine-info-cmd-contracts.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Machine Info CMD contract
        run: python Tests/survey/test_machine_info_cmd_contracts.py
      - name: CMD-first field-guide contract
        run: python Tests/survey/test_field_guide_cmd_first_contracts.py
      - name: Diff whitespace
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

  windows-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse Machine Info PowerShell surfaces with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'GetInfo\Get-MachineInfo.ps1',
            'scripts\Invoke-SasMachineInfo.ps1',
            'scripts\Invoke-SasUniversalField.ps1',
            'scripts\Invoke-SasNetworkAwareField.ps1',
            'scripts\Install-SasUniversalFieldLauncher.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "$file :: $($errors[0].Message)" }
          }
          'PASS: Machine Info PowerShell surfaces parse under Windows PowerShell 5.1'
