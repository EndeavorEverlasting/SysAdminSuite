name: Credentialed WinRM Software Deployment

on:
  pull_request:
    paths:
      - 'Deploy-ApprovedSoftwareCredentialed.cmd'
      - 'scripts/Invoke-SasCredentialedApprovedSoftwareInstall.ps1'
      - 'configs/software-packages/approved-apps.json'
      - 'docs/CREDENTIALED_WINRM_SOFTWARE_DEPLOYMENT.md'
      - 'Tests/survey/test_credentialed_winrm_software_deployment_contracts.py'
      - '.github/workflows/credentialed-winrm-software-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Python contract syntax
        run: python3 -m py_compile Tests/survey/test_credentialed_winrm_software_deployment_contracts.py
      - name: Validate credentialed WinRM contracts
        run: python3 Tests/survey/test_credentialed_winrm_software_deployment_contracts.py
      - name: Validate catalog JSON
        run: python3 -m json.tool configs/software-packages/approved-apps.json >/dev/null
      - name: Patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^
          fi

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse credentialed deployment entrypoint under Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\Invoke-SasCredentialedApprovedSoftwareInstall.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -gt 0) {
            $errors | Format-List * | Out-Host
            throw 'Credentialed WinRM deployment entrypoint failed Windows PowerShell 5.1 parsing.'
          }
          Write-Host 'PASS: credentialed WinRM deployment parses under Windows PowerShell 5.1'
      - name: Run static contracts on Windows
        shell: powershell
        run: python Tests/survey/test_credentialed_winrm_software_deployment_contracts.py
