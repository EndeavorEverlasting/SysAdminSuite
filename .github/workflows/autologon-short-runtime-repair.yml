name: AutoLogon Short Runtime Preservation

on:
  pull_request:
    paths:
      - 'scripts/Repair-SasAutoLogonShortRuntimeForRefresh.ps1'
      - 'Tests/survey/test_autologon_short_runtime_repair_contracts.py'
      - '.github/workflows/autologon-short-runtime-repair.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/Repair-SasAutoLogonShortRuntimeForRefresh.ps1'
      - 'Tests/survey/test_autologon_short_runtime_repair_contracts.py'
      - '.github/workflows/autologon-short-runtime-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile contract
        run: python -m py_compile Tests/survey/test_autologon_short_runtime_repair_contracts.py
      - name: Run contract
        run: python Tests/survey/test_autologon_short_runtime_repair_contracts.py
      - name: Check whitespace
        run: git diff --check

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse repair under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\Repair-SasAutoLogonShortRuntimeForRefresh.ps1'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) { throw ($errors | Out-String) }
      - name: Preserve a dirty generated runtime fixture intact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:TEMP ('SASAL-' + [guid]::NewGuid().ToString('N'))
          $state = Join-Path $env:TEMP ('SAS-State-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runtime,$state -Force | Out-Null
          git -C $runtime init | Out-Null
          git -C $runtime config user.email 'fixture@example.invalid'
          git -C $runtime config user.name 'fixture'
          Set-Content -LiteralPath (Join-Path $runtime 'tracked.txt') -Value 'baseline' -Encoding ASCII
          git -C $runtime add tracked.txt
          git -C $runtime commit -m fixture | Out-Null
          Set-Content -LiteralPath (Join-Path $runtime 'tracked.txt') -Value 'field-hotfix' -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $runtime 'untracked.txt') -Value 'preserve-me' -Encoding ASCII

          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\Repair-SasAutoLogonShortRuntimeForRefresh.ps1" -RuntimeRoot $runtime -StateRoot $state -FixtureMode
          if ($LASTEXITCODE -ne 0) { throw "repair fixture failed with exit $LASTEXITCODE" }
          if (Test-Path -LiteralPath $runtime) { throw 'dirty runtime was not displaced' }

          $receipts = @(Get-ChildItem -LiteralPath (Join-Path $state 'short-runtime-preservation') -Filter '*.json' -File)
          if ($receipts.Count -ne 1) { throw "expected one receipt, found $($receipts.Count)" }
          $receipt = Get-Content -LiteralPath $receipts[0].FullName -Raw | ConvertFrom-Json
          if ([string]$receipt.classification -ne 'DIRTY_RUNTIME') { throw "unexpected classification: $($receipt.classification)" }
          if ([bool]$receipt.target_contact_performed -or [bool]$receipt.target_mutation_performed -or [bool]$receipt.remote_git_performed) { throw 'repair fixture recorded forbidden activity' }
          $preserved = [string]$receipt.preserved_runtime_path
          if (-not (Test-Path -LiteralPath (Join-Path $preserved 'tracked.txt') -PathType Leaf)) { throw 'tracked dirty file was not preserved' }
          if (-not (Test-Path -LiteralPath (Join-Path $preserved 'untracked.txt') -PathType Leaf)) { throw 'untracked file was not preserved' }
          if ((Get-Content -LiteralPath (Join-Path $preserved 'tracked.txt') -Raw).Trim() -ne 'field-hotfix') { throw 'tracked hotfix content changed during preservation' }
          if ((Get-Content -LiteralPath (Join-Path $preserved 'untracked.txt') -Raw).Trim() -ne 'preserve-me') { throw 'untracked content changed during preservation' }
          Write-Host 'PASS: dirty generated runtime preserved intact without reset/clean/delete'
