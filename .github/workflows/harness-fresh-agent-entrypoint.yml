name: Harness Fresh-Agent Entrypoint

on:
  pull_request:
    paths:
      - 'harness/README.md'
      - 'harness/api/**'
      - 'harness/workflows/**'
      - 'harness/validators/**'
      - 'harness/skills/**'
      - 'harness/reports/**'
      - 'docs/HARNESS_STATUS.md'
      - 'CODEBASE_MAP.md'
      - 'Tests/survey/test_harness_fresh_agent_entrypoint_contracts.py'
      - 'Tests/survey/test_operational_harness_completeness_contracts.py'
      - '.githooks/**'
      - 'scripts/install-local-harness-hooks.sh'
      - '.github/workflows/harness-fresh-agent-entrypoint.yml'
  workflow_dispatch:

jobs:
  harness-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate harness registries
        run: python harness/validators/validate-harness-registries.py
      - name: Validate outcome contracts
        run: python harness/validators/validate-outcome-contracts.py
      - name: Validate deployment-state contracts
        run: python harness/validators/validate-deployment-state-contracts.py
      - name: Validate operational harness completeness
        run: python Tests/survey/test_operational_harness_completeness_contracts.py
      - name: Validate fresh-agent entrypoint
        run: python Tests/survey/test_harness_fresh_agent_entrypoint_contracts.py
      - name: Validate local harness contracts
        run: python Tests/survey/test_local_harness_contracts.py
      - name: Validate hook syntax
        run: |
          bash -n .githooks/pre-commit
          bash -n .githooks/pre-push
          bash -n scripts/install-local-harness-hooks.sh
      - name: Validate repository diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
