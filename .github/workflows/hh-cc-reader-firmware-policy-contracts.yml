      - '.github/workflows/hh-cc-reader-firmware-policy-contracts.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile policy validator
        run: python -m py_compile harness/validators/validate-hh-cc-reader-firmware-policy.py Tests/survey/test_hh_cc_reader_firmware_policy_contracts.py harness/api/hh_cc_reader_estate_authority.py harness/api/hh_cc_reader_estate_packet_normalize.py harness/api/hh_cc_reader_firmware_roundtrip.py harness/api/hh_cc_reader_firmware_event.py Tests/survey/test_hh_cc_reader_estate_authority_contracts.py Tests/survey/test_hh_cc_reader_estate_authority_launcher_contracts.py Tests/survey/test_hh_cc_reader_estate_packet_normalize_contracts.py Tests/survey/test_hh_cc_reader_firmware_roundtrip_contracts.py Tests/survey/test_hh_cc_reader_firmware_event_contracts.py harness/api/hh_cc_reader_live_execution_boundary.py Tests/survey/test_hh_cc_reader_live_execution_boundary_contracts.py harness/api/hh_cc_reader_firmware_protocols.py Tests/survey/test_hh_cc_reader_firmware_protocol_contracts.py harness/api/hh_cc_reader_paxstore_terminal_observe.py Tests/survey/test_hh_cc_reader_paxstore_terminal_observe_contracts.py
      - name: Validate firmware decision policy
        run: python harness/validators/validate-hh-cc-reader-firmware-policy.py
      - name: Run focused firmware policy contracts
        run: python Tests/survey/test_hh_cc_reader_firmware_policy_contracts.py
      - name: Run estate-authority call-stack contracts
        run: python Tests/survey/test_hh_cc_reader_estate_authority_contracts.py
      - name: Run estate-authority launcher contracts
        run: python Tests/survey/test_hh_cc_reader_estate_authority_launcher_contracts.py
      - name: Run estate-packet normalize contracts
        run: python Tests/survey/test_hh_cc_reader_estate_packet_normalize_contracts.py
      - name: Run firmware round-trip / batch contracts
        run: python Tests/survey/test_hh_cc_reader_firmware_roundtrip_contracts.py
      - name: Run firmware evidence event producer contracts
        run: python Tests/survey/test_hh_cc_reader_firmware_event_contracts.py
      - name: Run P95 live execution boundary contracts
        run: python Tests/survey/test_hh_cc_reader_live_execution_boundary_contracts.py
      - name: Run P95 firmware protocol portfolio contracts
        run: python Tests/survey/test_hh_cc_reader_firmware_protocol_contracts.py
      - name: Run PAXSTORE terminal observation contracts
        run: python Tests/survey/test_hh_cc_reader_paxstore_terminal_observe_contracts.py
      - name: Check pull-request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed commit whitespace
        if: github.event_name != 'pull_request'
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --oneline --no-renames HEAD
          fi
