name: AutoLogon Field Path Windows Parse
on: [pull_request]
permissions:
  contents: read
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Admin Box, refresh, and protected runtime entrypoints
        shell: powershell
        run: |
          foreach ($relative in @(
            'Bootstrap-SysAdminSuiteAutoLogon.ps1',
            'scripts\Prepare-SasAutoLogonShortRuntime.ps1',
            'scripts\Refresh-SasOperatorCommand.ps1',
            'scripts\SasPortableLauncher.ps1',
            'scripts\Invoke-SasAutoLogonOnsite.ps1',
            'scripts\Repair-SasAutoLogonS4UPathBudgetRuntime.ps1',
            'scripts\Repair-SasAutoLogonSmbStateCaptureRuntime.ps1',
            'scripts\SasAutoLogonStateCaptureCleanupPolicy.psm1',
            'scripts\Remove-SasExactRemoteAutoLogonStateCaptureRunRoot.ps1'
          )) {
            $path = Join-Path $PWD $relative
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $errors | Format-List * | Out-Host
              throw "AutoLogon field entrypoint parse failed: $relative"
            }
            Write-Host "PASS: $relative parses under Windows PowerShell 5.1"
          }
      - name: Execute CRLF and LF S4U path-budget runtime repair fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Tests\PowerShell\AutoLogonS4UPathBudgetRuntimeRepair.Tests.ps1
      - name: Execute SMB state-capture stderr runtime repair fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Tests\PowerShell\AutoLogonSmbStateCaptureRuntimeRepair.Tests.ps1
      - name: Validate exact state-capture residue cleanup policy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Tests\PowerShell\AutoLogonStateCaptureResidueCleanup.Tests.ps1
      - name: Resolve canonical FQDN under Windows PowerShell 5.1
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          Import-Module (Join-Path $PWD 'scripts\SasTargetNameResolution.psm1') -Force
          $resolver = {
            param($Name)
            if ($Name -eq 'fixture-target.example.invalid') {
              [pscustomobject]@{
                canonical_name = 'fixture-target.example.invalid'
                addresses = @('192.0.2.10')
              }
            }
          }
          $result = Resolve-SasCanonicalTargetFqdn -TargetName 'fixture-target.example.invalid' -DnsResolver $resolver
          if ($result.fqdn -ne 'fixture-target.example.invalid') { throw "Unexpected canonical FQDN: $($result.fqdn)" }
          if ([int]$result.suffix_candidate_count -ne 0) { throw "Expected zero suffix candidates for canonical FQDN, got $($result.suffix_candidate_count)" }
          if (@($result.addresses).Count -ne 1) { throw 'Expected one synthetic resolved address.' }
          Write-Host 'PASS: canonical FQDN resolution preserves an empty suffix array under Windows PowerShell 5.1 StrictMode'
      - name: Validate DomainAuthenticated VPN authority under Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\tests\SasNetworkGuard.Tests.ps1
