name: AutoLogon Crash-Safe Field Runner

on:
  pull_request:
    paths:
      - 'scripts/Invoke-SasAutoLogonCrashSafeFieldRun.ps1'
      - 'Run-AutoLogonCrashSafe.cmd'
      - 'Tests/survey/test_autologon_crash_safe_field_runner_contracts.py'
      - '.github/workflows/autologon-crash-safe-field-runner.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate crash-safe field runner contracts
        run: python3 Tests/survey/test_autologon_crash_safe_field_runner_contracts.py

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse crash-safe field runner under Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\Invoke-SasAutoLogonCrashSafeFieldRun.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -gt 0) {
            $errors | Format-List * | Out-Host
            throw 'Crash-safe field runner has PowerShell parse errors.'
          }
