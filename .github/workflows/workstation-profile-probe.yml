name: Workstation profile probe

on:
  pull_request:
    paths:
      - 'Probe-TangentProfile.cmd'
      - 'scripts/Invoke-SasReadOnlyWorkstationProfileProbe.ps1'
      - 'Tests/PowerShell/WorkstationProfileProbe.Tests.ps1'
      - '.github/workflows/workstation-profile-probe.yml'
  push:
    branches: [main]
    paths:
      - 'Probe-TangentProfile.cmd'
      - 'scripts/Invoke-SasReadOnlyWorkstationProfileProbe.ps1'
      - 'Tests/PowerShell/WorkstationProfileProbe.Tests.ps1'
      - '.github/workflows/workstation-profile-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse read-only workstation profile probe
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\Invoke-SasReadOnlyWorkstationProfileProbe.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -gt 0) { throw ($errors | Out-String) }
      - name: Execute local read-only comparison fixture
        shell: powershell
        run: .\Tests\PowerShell\WorkstationProfileProbe.Tests.ps1

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace
        run: git diff --check HEAD^
      - name: Enforce operator-local evidence and non-deployment language
        run: |
          grep -F "SysAdminSuite\\Evidence\\WorkstationProfile" scripts/Invoke-SasReadOnlyWorkstationProfileProbe.ps1
          grep -F "NONE_READ_ONLY_DISCOVERY" scripts/Invoke-SasReadOnlyWorkstationProfileProbe.ps1
          grep -F "TargetMutationPerformed = \$false" scripts/Invoke-SasReadOnlyWorkstationProfileProbe.ps1
          ! grep -E "Set-WmiInstance|Invoke-WmiMethod|Set-CimInstance|Invoke-CimMethod|Restart-Computer|Stop-Computer" scripts/Invoke-SasReadOnlyWorkstationProfileProbe.ps1
